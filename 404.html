<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>直播运营驾驶舱</title>
    <style>
      :root {
        color: #171614;
        font-family:
          Inter,
          "PingFang SC",
          "Microsoft YaHei",
          system-ui,
          -apple-system,
          sans-serif;
        background: #f7f3ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 15% 8%,
            rgb(239 117 78 / 12%),
            transparent 28rem
          ),
          #f7f3ed;
      }
      main {
        width: min(90vw, 380px);
        padding: 32px;
        border: 1px solid #e5ded4;
        border-radius: 18px;
        background: rgb(255 255 255 / 88%);
        box-shadow: 0 14px 36px rgb(62 46 33 / 8%);
        text-align: center;
      }
      .mark {
        width: 46px;
        height: 46px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #fbe8df;
        color: #d85232;
        font-weight: 800;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 21px;
      }
      p {
        margin: 0;
        color: #6f675f;
        font-size: 14px;
        line-height: 1.7;
      }
      .spinner {
        width: 24px;
        height: 24px;
        margin: 22px auto 0;
        border: 3px solid #eadfd4;
        border-top-color: #d85232;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      button {
        display: none;
        width: 100%;
        margin-top: 22px;
        padding: 11px 16px;
        border: 0;
        border-radius: 10px;
        background: #171614;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">LIVE</div>
      <h1>正在连接直播运营驾驶舱</h1>
      <p id="status">正在查找当前可用的数据网关，请稍候。</p>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <button type="button" id="retry">重新连接</button>
    </main>
    <script>
      const dashboardOrigin = "https://jskzsjfx.netlify.app";
      const repositoryPrefix = "/Shujufenxi_1";
      const retryDelayMs = 5000;
      const probeTimeoutMs = 5000;
      const status = document.querySelector("#status");
      const spinner = document.querySelector("#spinner");
      const retry = document.querySelector("#retry");
      let retryTimer;

      function destinationPath() {
        const remainder = window.location.pathname.startsWith(repositoryPrefix)
          ? window.location.pathname.slice(repositoryPrefix.length)
          : "/";
        if (
          !remainder ||
          remainder === "/" ||
          remainder === "/index.html" ||
          remainder === "/404.html"
        ) {
          return "/";
        }
        return remainder.startsWith("/") ? remainder : `/${remainder}`;
      }

      async function assertOriginReady(origin) {
        const controller = new AbortController();
        const timeout = window.setTimeout(
          () => controller.abort(),
          probeTimeoutMs,
        );
        try {
          const response = await fetch(new URL("/health", origin), {
            cache: "no-store",
            credentials: "omit",
            signal: controller.signal,
          });
          if (!response.ok) {
            throw new Error(`runtime origin returned ${response.status}`);
          }
        } finally {
          window.clearTimeout(timeout);
        }
      }

      function scheduleRetry() {
        status.textContent =
          "检测到网关地址正在切换，系统将在 5 秒后自动重试。";
        spinner.style.display = "block";
        retry.style.display = "block";
        window.clearTimeout(retryTimer);
        retryTimer = window.setTimeout(connect, retryDelayMs);
      }

      async function connect() {
        window.clearTimeout(retryTimer);
        spinner.style.display = "block";
        retry.style.display = "none";
        status.textContent = "正在查找当前可用的数据网关，请稍候。";
        try {
          const origin = new URL(dashboardOrigin);
          await assertOriginReady(origin);
          const target = new URL(
            `${destinationPath()}${window.location.search}${window.location.hash}`,
            origin,
          );
          window.location.replace(target.href);
        } catch (error) {
          console.error(error);
          scheduleRetry();
        }
      }

      retry.addEventListener("click", () => {
        window.clearTimeout(retryTimer);
        connect();
      });
      connect();
    </script>
  </body>
</html>
