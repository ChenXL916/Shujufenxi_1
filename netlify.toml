[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[edge_functions]]
  function = "backend-proxy"
  path = "/api/*"

[[edge_functions]]
  function = "backend-proxy"
  path = "/auth/*"

[[edge_functions]]
  function = "backend-proxy"
  path = "/health"

[[edge_functions]]
  function = "backend-proxy"
  path = "/ready"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
